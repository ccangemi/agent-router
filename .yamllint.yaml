extends: default
ignore: |
  bin/
  build/
  bundle/
  config/crd/upstream/
  helm-charts/agent-router/charts/
  helm-charts/agent-router/templates/
rules:
  line-length:
    max: 140
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  indentation:
    indent-sequences: consistent
