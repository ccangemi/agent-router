# Envoy Gateway always runs the Envoy proxy with the fixed user ID 65532, which
# the restricted-v2 SCC does not allow. In Gateway Namespace Mode each Gateway
# gets a service account with the same name as the Gateway, in the namespace of
# the Gateway. This RoleBinding gives that service account the nonroot-v2 SCC.
# Add one subject for every Gateway in the namespace.
#
# These examples need Envoy Gateway in the Gateway Namespace Mode, as in the
# example envoygateway-with-agent-router.yaml of the Envoy Gateway operator. In
# the ControllerNamespace mode the proxies run in the Envoy Gateway namespace,
# with generated service account names.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nonroot-v2-envoy-proxies
  namespace: ar-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
  - kind: ServiceAccount
    name: agent-router-basic
    namespace: ar-test
