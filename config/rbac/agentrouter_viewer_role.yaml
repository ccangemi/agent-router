# This rule is not used by the project agent-router-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to agentrouter.ccangemi.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: agent-router-operator
    app.kubernetes.io/managed-by: kustomize
  name: agentrouter-viewer-role
rules:
- apiGroups:
  - agentrouter.ccangemi.github.io
  resources:
  - agentrouters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - agentrouter.ccangemi.github.io
  resources:
  - agentrouters/status
  verbs:
  - get
