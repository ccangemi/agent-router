# This rule is not used by the project agent-router-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over agentrouter.ccangemi.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: agent-router-operator
    app.kubernetes.io/managed-by: kustomize
  name: agentrouter-admin-role
rules:
- apiGroups:
  - agentrouter.ccangemi.github.io
  resources:
  - agentrouters
  verbs:
  - '*'
- apiGroups:
  - agentrouter.ccangemi.github.io
  resources:
  - agentrouters/status
  verbs:
  - get
