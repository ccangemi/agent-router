# The operator manifests for OLM: namespace and name prefix of every object.
namespace: agent-router-operator-system
namePrefix: agent-router-operator-

resources:
  - ../crd
  - ../rbac
  - ../manager
  # The metrics service of the controller manager (HTTPS on port 8443).
  - metrics_service.yaml

patches:
  # Serve the metrics endpoint with HTTPS and authorization on port 8443.
  - path: manager_metrics_patch.yaml
    target:
      kind: Deployment
