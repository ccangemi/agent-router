---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentrouters.agentrouter.ccangemi.github.io
spec:
  group: agentrouter.ccangemi.github.io
  names:
    kind: AgentRouter
    listKind: AgentRouterList
    plural: agentrouters
    singular: agentrouter
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Deployed
          type: string
          jsonPath: .status.conditions[?(@.type=="Deployed")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Deployed")].reason
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >-
            AgentRouter installs the Agent Router controller (formerly Envoy AI
            Gateway) in the namespace of the resource, with the upstream
            ai-gateway-helm chart. Create one AgentRouter, named agent-router,
            in the namespace of the operator.
          type: object
          # One release per namespace. The names of the cluster-scoped objects
          # of the chart contain the release namespace, and the controller
          # names are fixed, so a second resource would conflict.
          x-kubernetes-validations:
            - rule: self.metadata.name == 'agent-router'
              message: the AgentRouter resource must be named agent-router
          properties:
            apiVersion:
              description: >-
                APIVersion defines the versioned schema of this representation
                of an object.
              type: string
            kind:
              description: >-
                Kind is a string value representing the REST resource this
                object represents.
              type: string
            metadata:
              type: object
            spec:
              description: >-
                Values of the operator chart. The values of the upstream
                ai-gateway-helm chart go under the key "ai-gateway-helm". Some
                values are set by the operator; see the operator
                documentation.
              type: object
              default: {}
              x-kubernetes-preserve-unknown-fields: true
            status:
              description: >-
                Status of the Helm release, written by the operator.
              type: object
              x-kubernetes-preserve-unknown-fields: true
